services:
  sh-runner:
    container_name: sh-runner
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      # true = also run job scripts on every container start
      EXECUTE_ON_START: "false"
      CRON_SCHEDULE: "0 2 * * *"
    volumes:
      - ./logger:/logger
      - ./scripts-example:/sh-scripts
